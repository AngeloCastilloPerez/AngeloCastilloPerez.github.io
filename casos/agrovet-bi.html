<style>
/* mismos tokens que index.html: #000000 de fondo, Inter + JetBrains Mono,
   degradado #FF3D5A -> #FF8C42 como unico acento. */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000000;font-family:'Inter',system-ui,sans-serif;color:#fff;overflow-x:hidden}
a{color:#FF8C42;text-decoration:none}
a:hover{color:#FF3D5A}
h1,h2,h3,p{margin:0}
button{font:inherit}
img{max-width:100%;display:block}
::selection{background:rgba(255,61,90,.35)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

.wrap{position:relative;max-width:1180px;margin:0 auto;padding:0 34px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.46)}
.block-t{font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#FF8C42}
.meta-k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:7px}
.meta-v{font-size:13px;color:#fff;line-height:1.5}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 12px}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 34px;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.06)}
.brand{font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.72)}
.topnav{display:flex;align-items:center;gap:20px}
.back-btn{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.62)}
.back-btn:hover{color:#FF8C42}
.langbox{display:flex;gap:6px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px;
  background:rgba(13,13,24,.6)}
.langbtn{font-size:10.5px;letter-spacing:.14em;padding:5px 12px;border-radius:999px;border:none;cursor:pointer;
  background:transparent;color:rgba(255,255,255,.46);transition:all .25s ease;font-family:'JetBrains Mono',monospace}
.langbtn.on{background:#fff;color:#000000}

/* ---------- HEAD DEL CASO ---------- */
.case-head{position:relative;padding:72px 0 54px;overflow:hidden}
.case-head::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 900px 520px at 18% 25%,rgba(255,61,90,.13),transparent 70%),
             radial-gradient(ellipse 720px 480px at 88% 70%,rgba(123,47,255,.10),transparent 70%)}
.case-head .wrap{z-index:1}
.case-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:52px;align-items:start}
.case-head h1{font-weight:300;font-size:clamp(38px,6.4vw,72px);letter-spacing:-.03em;line-height:1;margin:14px 0 18px}
.case-head h1 i{font-style:normal;background:linear-gradient(135deg,#FF3D5A,#FF8C42);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:14.5px;line-height:1.75;color:rgba(255,255,255,.66);max-width:52ch;margin-bottom:24px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.factsheet{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:26px 28px;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012))}
.factsheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FF8C42;margin-right:8px;vertical-align:2px}
.notice{margin-top:22px;border-left:2px solid #FF8C42;padding:2px 0 2px 16px}
.notice b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:rgba(255,255,255,.42);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.notice p{font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.78)}

/* ---------- SECCIONES ---------- */
section.blk{padding:64px 0;border-top:1px solid rgba(255,255,255,.07)}
.sec-head{max-width:62ch;margin-bottom:38px}
.sec-head h2{font-weight:300;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.024em;line-height:1.1;margin:14px 0 16px}
.sec-head p{font-size:13.5px;line-height:1.8;color:rgba(255,255,255,.6)}

.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px}
.card{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:24px 24px 26px;
  background:rgba(255,255,255,.02)}
.card h3{font-size:14px;font-weight:500;letter-spacing:-.01em;margin-bottom:10px}
.card p{font-size:12.5px;line-height:1.75;color:rgba(255,255,255,.58)}
.card i{display:block;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;
  color:#FF8C42;margin-bottom:14px}

/* ---------- FLUJO DE ARQUITECTURA ---------- */
/* el flujo se dibuja con grid + flechas en ::after para no depender de ninguna
   libreria: en movil el auto-fit lo apila y las flechas se apagan. */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-bottom:40px}
.node{position:relative;border:1px solid rgba(255,255,255,.11);border-radius:12px;padding:18px 16px;
  background:rgba(255,255,255,.025);text-align:center}
.node:not(:last-child)::after{content:"\2192";position:absolute;right:-19px;top:50%;transform:translateY(-50%);
  font-size:14px;color:rgba(255,140,66,.65)}
.node em{display:block;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.35);margin-bottom:9px}
.node b{display:block;font-size:12.5px;font-weight:500;letter-spacing:.04em}
.node span{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;
  color:rgba(255,255,255,.5);margin-top:8px}
.node.src{border-color:rgba(255,255,255,.2)}
.node.out{border-color:rgba(255,140,66,.45);background:linear-gradient(160deg,rgba(255,61,90,.10),rgba(255,140,66,.04))}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.layer-i{border-left:2px solid rgba(255,140,66,.5);padding-left:16px}
.layer-i h4{margin:0 0 8px;font-size:12px;font-weight:500;letter-spacing:.06em;
  font-family:'JetBrains Mono',monospace;color:#fff}
.layer-i p{font-size:12.5px;line-height:1.75;color:rgba(255,255,255,.56)}

/* ---------- VISTAS / GALERIA ---------- */
.view{border-top:1px solid rgba(255,255,255,.07);padding-top:38px;margin-top:44px}
.view:first-of-type{border-top:none;padding-top:0;margin-top:0}
/* El titulo va a ancho completo y la descripcion con sus bullets a dos columnas
   debajo. Antes era una grilla 50/50 con el titulo solo en la izquierda: dos
   lineas de texto contra ~150px de contenido en la derecha dejaban un hueco
   muerto del alto de la columna en cada una de las cinco vistas. */
.view-title{margin-bottom:24px}
.view-n{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:#FF8C42;margin-bottom:10px}
.view-title h3{font-weight:300;font-size:clamp(21px,2.6vw,30px);letter-spacing:-.02em;line-height:1.15;
  max-width:34ch;text-wrap:balance}
.view-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start;
  margin-bottom:26px}
.view-body p{font-size:13px;line-height:1.8;color:rgba(255,255,255,.6)}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.bullets li{position:relative;padding-left:20px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  line-height:1.7;color:rgba(255,255,255,.68)}
.bullets li::before{content:"\25B8";position:absolute;left:0;top:0;color:#FF8C42}
figure.shot{margin:0;border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;
  background:#0D0D0D;box-shadow:0 30px 70px rgba(0,0,0,.5)}
figure.shot figcaption{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  color:rgba(255,255,255,.42);padding:12px 16px;border-top:1px solid rgba(255,255,255,.07)}
/* la vista reconstruida se embute viva en vez de como captura: el hover, el
   colapso de la jerarquia y el cambio de tema son parte de lo entregado.
   Ocupa el ancho del .wrap y nada mas: sacarla del contenedor con margenes
   negativos dependia del ancho del padre y se desbordaba. El dashboard ya se
   maqueta a dos columnas desde 980px, asi que a 1112px entra bien. */
figure.shot .live{position:relative;background:#000000}
/* alto de arranque; el JS lo ajusta al contenido real para que no haya un
   scroll dentro de otro scroll */
figure.shot .live iframe{width:100%;height:1180px;border:0;display:block}
figure.shot .cap-row{display:flex;justify-content:space-between;align-items:center;gap:16px;
  flex-wrap:wrap;padding:12px 16px;border-top:1px solid rgba(255,255,255,.07)}
figure.shot .cap-row figcaption{padding:0;border:0}
figure.shot .cap-row a{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;white-space:nowrap}
@media(max-width:900px){
  /* en movil el dashboard se apila: alto fijo con scroll propio */
  figure.shot .live iframe{height:620px}
}

/* ---------- DECISIONES ---------- */
.dec{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:26px 34px}
.dec>div{border-top:1px solid rgba(255,255,255,.1);padding-top:16px}
.dec h4{margin:0 0 9px;font-size:13px;font-weight:500;letter-spacing:-.005em}
.dec p{font-size:12.5px;line-height:1.75;color:rgba(255,255,255,.56)}
.dec span{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;
  color:rgba(255,255,255,.32);margin-bottom:10px}

/* ---------- RESULTADO ---------- */
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.result>div{border:1px solid rgba(255,140,66,.28);border-radius:12px;padding:24px;
  background:linear-gradient(160deg,rgba(255,61,90,.09),rgba(255,140,66,.02))}
.result b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:#FF8C42;font-weight:500;margin-bottom:12px}
.result p{font-size:13px;line-height:1.75;color:rgba(255,255,255,.8)}

/* ---------- CIERRE ---------- */
.foot{padding:72px 0 56px;border-top:1px solid rgba(255,255,255,.07);text-align:center}
.foot h2{font-weight:300;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.024em;margin-bottom:14px}
.foot p{font-size:13px;line-height:1.7;color:rgba(255,255,255,.55);margin-bottom:28px}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;font-size:12px;
  font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.cta i{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#FF3D5A,#FF8C42);color:#fff;font-size:18px;font-style:normal;
  box-shadow:0 8px 26px rgba(255,61,90,.4)}
.cta:hover{color:#FF8C42}
.foot-back{display:block;margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.foot-back:hover{color:#FF8C42}
.copyright{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;
  color:rgba(255,255,255,.28)}
.disclaimer{margin-top:26px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.8;
  color:rgba(255,255,255,.34);max-width:74ch}

  align-items:center;justify-content:center}

@media(max-width:900px){
  .case-grid{grid-template-columns:1fr;gap:32px}
  .view-body{grid-template-columns:1fr;gap:22px}
  .flow{grid-template-columns:1fr;gap:12px}
  .node:not(:last-child)::after{content:"\2193";right:auto;left:50%;top:auto;bottom:-13px;transform:translateX(-50%)}
  .wrap{padding:0 22px}
  .topbar{padding:14px 22px}
  .case-head{padding:48px 0 40px}
  section.blk{padding:48px 0}
}
@media(max-width:560px){
  .factsheet .grid{grid-template-columns:1fr}
  .topnav{gap:12px}
  .back-btn span:last-child{display:none}
}
</style>

var lang = 'es';

function applyStrings(){
  var t = T[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-t');
    if(t[k] !== undefined) nodes[i].innerHTML = t[k];
  }
  var btns = document.querySelectorAll('.langbtn');
  for(var j=0;j<btns.length;j++){
    btns[j].classList.toggle('on', btns[j].getAttribute('data-lang')===lang);
  }
}

document.querySelectorAll('.langbtn').forEach(function(b){
  b.onclick = function(){ lang = b.getAttribute('data-lang'); applyStrings(); };
});

/* Las cinco vistas van embebidas y son del mismo origen, asi que se puede medir
   su alto real y ajustar cada iframe: sin esto queda un scroll dentro del scroll
   de la pagina. Se re-mide al colapsar filas y al cambiar el ancho. */
document.querySelectorAll('.live iframe').forEach(function(fr){
  var fit = function(){
    try{
      var d = fr.contentDocument;
      if(!d || !d.body) return;
      /* en movil manda el alto fijo del CSS: el dashboard se apila y seria enorme */
      if(matchMedia('(max-width:900px)').matches){ fr.style.height = ''; return; }
      fr.style.height = Math.max(700, d.documentElement.scrollHeight) + 'px';
    }catch(e){ /* si algun dia se sirve cross-origin, se queda el alto del CSS */ }
  };
  var wire = function(){
    fit();
    try{
      var d = fr.contentDocument;
      /* el colapso de la jerarquia y los conmutadores cambian el alto */
      d.addEventListener('click', function(){ setTimeout(fit, 0); });
      if(window.ResizeObserver) new ResizeObserver(fit).observe(d.documentElement);
    }catch(e){}
  };
  fr.addEventListener('load', wire);
  /* Si el iframe termino de cargar antes de que corriera este script, su
     evento load ya paso y no vuelve: hay que cablearlo a mano. Sin esto las
     cinco vistas se quedaban con el alto de arranque del CSS, recortadas y
     con su propio scroll dentro del scroll de la pagina. */
  try{
    var d0 = fr.contentDocument;
    if(d0 && d0.readyState === 'complete' && d0.body && d0.body.childElementCount) wire();
  }catch(e){}
  addEventListener('resize', fit);
});

/* ?lang=en para poder linkear la version en ingles desde el portafolio */
var qs = new URLSearchParams(location.search);
if(qs.get('lang') === 'en') lang = 'en';
applyStrings();
