<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angelo Castillo — CEO &amp; Fundador de HERO</title>
<meta name="description" content="CEO y Fundador de HERO. Diseño y construyo agentes de IA, automatizaciones y plataformas inteligentes, sobre una base de 5+ años en Data Analytics y Business Intelligence.">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#080810;font-family:'Inter',system-ui,sans-serif;color:#fff;overflow-x:hidden}
a{color:#FF8C42;text-decoration:none}
a:hover{color:#FF3D5A}
h1,h2,h3,p{margin:0}
button{font:inherit}
::selection{background:rgba(255,61,90,.35)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

@keyframes floatY{from{transform:translateY(-9px)}to{transform:translateY(11px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- HERO ---------- */
.hero-track{position:relative;height:280vh}
.hero-stick{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;transform:scale(1.08);will-change:transform}
.hero-bg video{width:100%;height:100%;object-fit:cover;display:block}
.hero-scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,8,16,.18),transparent 22%,transparent 78%,rgba(8,8,16,.78)),
             radial-gradient(ellipse 560px 400px at 50% 50%,rgba(8,8,16,.62),rgba(8,8,16,.12) 62%,transparent 82%)}
.hero-vignette{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 540px 380px at 50% 50%,rgba(8,8,16,.45),rgba(8,8,16,.10) 58%,transparent 78%)}
.layer{position:absolute;inset:0;pointer-events:none;will-change:transform}

.fcard{position:absolute;pointer-events:auto}
.fcard-frame{border-radius:24px;padding:0;border:1px solid transparent;box-shadow:0 24px 60px rgba(0,0,0,.5);
  cursor:pointer;overflow:hidden;
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .45s ease,box-shadow .45s ease,border-color .45s ease,filter .45s ease}
.fcard-frame:hover{transform:translateY(-5px) scale(1.02) !important;border-color:rgba(255,255,255,.28)}
.fcard-img{aspect-ratio:1/1;border-radius:23px;background-size:cover;background-position:center;display:block}
.fcard-frame.is-active{border-color:rgba(255,140,66,.65);box-shadow:0 0 60px rgba(255,61,90,.35),0 24px 60px rgba(0,0,0,.5);transform:scale(1.08)}
.fcard-frame.is-dim{opacity:.14;filter:grayscale(1);transform:scale(.95)}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
  align-items:center;padding:24px 36px;gap:16px;flex-wrap:wrap}
.brand{font-size:12px;font-weight:500;letter-spacing:.22em;color:rgba(255,255,255,.72)}
.topnav{display:flex;align-items:center;gap:20px}
.toplink{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.72);transition:color .25s ease}
.toplink:hover{color:#FF8C42}
.toplink span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;border:1px solid rgba(255,255,255,.16);font-size:10px}
.langbox{display:flex;gap:6px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px;
  background:rgba(13,13,24,.6);backdrop-filter:blur(8px)}
.langbtn{font-size:10.5px;letter-spacing:.14em;padding:5px 12px;border-radius:999px;border:none;cursor:pointer;
  background:transparent;color:rgba(255,255,255,.46);transition:all .25s ease}
.langbtn.on{background:#fff;color:#080810}

/* sin transition: la opacidad la escribe el scroll frame a frame, y una
   transicion encima solo agregaba 150ms de retraso al fundido */
.hero-content{position:relative;z-index:5;height:100%;display:flex;align-items:center;justify-content:center;
  pointer-events:none;will-change:transform,opacity}
.hero-inner{max-width:720px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;
  pointer-events:auto;padding:0 24px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.46)}
.hero-inner h1{font-weight:300;font-size:clamp(42px,8.5vw,84px);letter-spacing:-.028em;line-height:1;text-wrap:balance}
.hero-role{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#FF8C42}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:600px}
.chip{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:8px 15px;
  border-radius:999px;cursor:pointer;background:rgba(13,13,24,.6);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.72);transition:all .3s cubic-bezier(.22,1,.36,1)}
.chip:hover{border-color:rgba(255,255,255,.3)}
.chip.on{background:rgba(255,140,66,.10);border-color:rgba(255,140,66,.55);color:#FF8C42}
.cta-light{display:inline-flex;align-items:center;gap:12px;padding:9px 24px 9px 9px;border-radius:999px;
  font-size:13.5px;font-weight:500;background:#fff;color:#080810;margin-top:8px;
  transition:all .25s cubic-bezier(.22,1,.36,1)}
.cta-light:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.5);color:#080810}
.cta-light i,.cta-flame i{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;font-size:15px;font-style:normal}
.cta-light i{background:linear-gradient(135deg,#FF3D5A,#FF8C42);color:#fff}
.scroll-hint{font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.55)}

/* ---------- CLIENTES ---------- */
.clients-strip{padding:32px 0;background:#0B0B16;border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative;z-index:6}
.clients-label{text-align:center;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.46);margin-bottom:20px}
.clients-wrap{position:relative;overflow:hidden}
.clients-wrap::before,.clients-wrap::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
.clients-wrap::before{left:0;background:linear-gradient(to right,#0B0B16 0%,transparent 100%)}
.clients-wrap::after{right:0;background:linear-gradient(to left,#0B0B16 0%,transparent 100%)}
.clients-track{display:flex;align-items:center;width:max-content;animation:scrollClients 22s linear infinite}
.clients-track:hover{animation-play-state:paused}
@keyframes scrollClients{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.client-item{display:flex;align-items:center;gap:10px;padding:0 40px;height:60px;flex-shrink:0;
  border-right:1px solid rgba(255,255,255,.08)}
.client-item img{height:36px;width:auto;max-width:44px;object-fit:contain;flex-shrink:0;
  filter:grayscale(100%) opacity(.55);transition:filter .3s ease,transform .3s ease}
.client-item:hover img{filter:grayscale(0%) opacity(1);transform:scale(1.08)}
.client-item b{font-size:13px;font-weight:500;color:rgba(255,255,255,.55);white-space:nowrap;
  letter-spacing:.02em;transition:color .3s ease}
.client-item:hover b{color:#fff}

/* ---------- SECTIONS ---------- */
.section{position:relative;padding:110px 38px 70px;overflow:hidden}
.section-head{max-width:1180px;margin:0 auto 20px;display:flex;align-items:baseline;justify-content:space-between;
  gap:20px;flex-wrap:wrap}
.section-head h2{font-weight:300;font-size:clamp(28px,4vw,38px);letter-spacing:-.025em}
.section-head .eyebrow{margin-bottom:14px}
.counter{font-size:11px;color:rgba(255,255,255,.30)}

/* ---------- VINYL SHELF ---------- */
.shelf-scroll{perspective:2200px;perspective-origin:50% 46%;width:100%;overflow-x:auto;overflow-y:hidden;
  padding:80px 0 30px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent}
.shelf-scroll::-webkit-scrollbar{height:6px}
.shelf-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:999px}
.shelf{display:flex;justify-content:center;align-items:center;transform-style:preserve-3d;min-width:min-content;padding:0 90px}
.vinyl{position:relative;flex:0 0 auto;width:196px;height:262px;margin-left:-104px;
  transform:rotateY(-42deg);transform-origin:50% 50%;transform-style:preserve-3d;cursor:pointer;
  transition:transform .55s cubic-bezier(.22,1,.36,1),margin .55s cubic-bezier(.22,1,.36,1),filter .45s ease}
.vinyl:hover{transform:rotateY(0deg) translateZ(120px) translateY(-16px) scale(1.04);
  margin-left:-40px;margin-right:64px;filter:none;z-index:99 !important}
.vinyl-sleeve{position:absolute;inset:0;border-radius:12px;background-size:cover;background-position:center;
  box-shadow:-22px 26px 46px rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.10);overflow:hidden}
.vinyl-sleeve::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.vinyl-sleeve::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(0,0,0,.25))}
.vinyl-cap{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-size:11px;letter-spacing:.06em;
  color:rgba(255,255,255,.72);white-space:nowrap;opacity:0;transition:opacity .4s ease}
.vinyl:hover .vinyl-cap{opacity:1}
.vinyl-cap b{color:#FF8C42;font-weight:500}
.shelf-hint{text-align:center;margin-top:22px;font-size:10.5px;letter-spacing:.14em;color:rgba(255,255,255,.3)}
.shelf-chips{margin:26px auto 0;max-width:660px}

/* ---------- EXPERIENCIA ---------- */
#experiencia{position:relative;height:520vh;padding:0}
.exp-stick{position:sticky;top:0;min-height:100vh;display:flex;align-items:center;
  padding:80px 38px;border-top:1px solid rgba(255,255,255,.08)}
.exp-grid{max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);
  gap:60px;align-items:center}
.exp-figure{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.morph-stage{position:relative;width:200px;height:320px}
.morph-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* idem: el morfismo lo controla el scroll, la transicion lo hacia arrastrar */
.lyr{will-change:opacity}
.symb{width:100%;max-width:240px}
.symb-top{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px}
.symb-top b{font-size:15px;font-weight:600;color:#C4A8FF;letter-spacing:.04em}
.symb-rail{height:3px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden}
.symb-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#FF8C42,#FF3D5A 55%,#7B2FFF);
  transition:width .12s linear}

/* el padding-left tiene que cubrir el dot (-34px), el translateX(-6px) de las
   etapas inactivas y los 4px de anillo de la activa: 34+6+4 = 44 minimo.
   Con 34px el overflow:hidden recortaba 6px del circulo y el anillo entero. */
.timeline{position:relative;padding-left:46px;max-height:62vh;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 8%,#000 88%,transparent)}
/* el rail va por el centro del dot activo: 46-34 + 19/2 = 21.5 */
.timeline::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.12);z-index:1}
.timeline-inner{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.stage{position:relative;padding:0 0 22px;opacity:.35;transform:translateX(-6px);
  transition:opacity .35s ease,transform .35s ease}
.stage.on{opacity:1;transform:translateX(0)}
.stage-dot{position:absolute;left:-34px;top:3px;width:19px;height:19px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:#080810;display:flex;align-items:center;justify-content:center;
  font-size:8.5px;color:rgba(255,255,255,.5);transition:all .35s ease}
.stage.on .stage-dot{border-color:#FF8C42;color:#FF8C42;box-shadow:0 0 0 4px rgba(255,140,66,.08)}
.stage.on.hero-stage .stage-dot{border-color:#C4A8FF;color:#C4A8FF;box-shadow:0 0 0 4px rgba(123,47,255,.12)}
.stage-period{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.30);margin-bottom:5px}
.stage.hero-stage .stage-period{color:#C4A8FF}
.stage h3{font-size:17px;font-weight:400;letter-spacing:-.01em;margin-bottom:3px}
.stage-co{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:7px}
.stage p{font-size:12.5px;line-height:1.65;color:rgba(255,255,255,.55);max-width:52ch;margin-bottom:9px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:4px 9px}
.exp-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.08)}
.exp-stat b{display:block;font-size:26px;font-weight:300;letter-spacing:-.02em;color:#fff}
.exp-stat span{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* ---------- CONTACTO ---------- */
.contact{border-top:1px solid rgba(255,255,255,.08);text-align:center;padding:100px 24px 60px;position:relative}
.contact h2{font-weight:300;font-size:clamp(30px,5vw,44px);letter-spacing:-.025em;text-wrap:balance;margin:0 0 14px}
.contact p{margin:0 auto 34px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.46);max-width:44ch}
.cta-flame{display:inline-flex;align-items:center;gap:12px;padding:9px 22px 9px 9px;border-radius:999px;
  font-size:13px;font-weight:600;background:linear-gradient(135deg,#FF3D5A,#FF8C42);color:#fff;
  transition:all .25s cubic-bezier(.22,1,.36,1)}
.cta-flame:hover{transform:translateY(-1px);box-shadow:0 12px 36px rgba(255,61,90,.32);color:#fff}
.cta-flame i{background:rgba(0,0,0,.28);color:#fff}
.foot-links{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;margin-top:44px;font-size:11px;letter-spacing:.12em}
.foot-links a{color:rgba(255,255,255,.5)}
.foot-links a:hover{color:#FF8C42}
.copyright{margin-top:44px;font-size:10.5px;letter-spacing:.12em;color:rgba(255,255,255,.30)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;z-index:100;background:#0A0A12;overflow-y:auto;overflow-x:hidden;display:none}
.modal.open{display:block}
.modal::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 900px 600px at 22% 40%,rgba(255,61,90,.10),transparent 70%),
             radial-gradient(ellipse 700px 500px at 85% 80%,rgba(123,47,255,.08),transparent 70%)}
.modal-inner{position:relative;max-width:1240px;margin:0 auto;padding:30px 46px 60px}
.modal-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:16px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;font-size:11px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);padding:0}
.back-btn:hover{color:#FF8C42}
.nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:none;
  color:rgba(255,255,255,.7);cursor:pointer;font-size:14px}
.nav-btn:hover{border-color:#FF8C42;color:#FF8C42}
.modal-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:52px;align-items:center;margin-bottom:40px}
.sleeve-wrap{position:relative;display:flex;align-items:center}
.sleeve-big{position:relative;z-index:2;width:78%;aspect-ratio:1/1;border-radius:8px;background-size:cover;
  background-position:center;box-shadow:0 40px 80px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
.disc{position:absolute;right:2%;top:50%;transform:translateY(-50%);z-index:1;width:52%;aspect-ratio:1/1;
  border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#111 0 2px,#050505 2px 4px);
  box-shadow:0 30px 60px rgba(0,0,0,.55);animation:spin 8s linear infinite;
  display:flex;align-items:center;justify-content:center}
.disc-label{width:34%;height:34%;border-radius:50%;background-size:cover;background-position:center;border:3px solid #0A0A12}
.disc-hole{position:absolute;width:7px;height:7px;border-radius:50%;background:#0A0A12}
.modal-cat{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#FF8C42;margin-bottom:10px}
.modal-top h2{font-weight:300;font-size:clamp(32px,5vw,52px);letter-spacing:-.03em;line-height:1;margin-bottom:16px}
.modal-desc{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.62);max-width:46ch;margin-bottom:22px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66);
  border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 12px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px 30px;margin-bottom:28px}
.meta-k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:7px}
.meta-v{font-size:13px;color:#fff}
.dot-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FF8C42;margin-right:8px;vertical-align:2px}
.play-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.play-btn{display:inline-flex;align-items:center;gap:14px}
.play-btn em{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#FF3D5A,#FF8C42);color:#fff;font-size:18px;font-style:normal;
  box-shadow:0 8px 26px rgba(255,61,90,.4)}
.play-btn span{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.ext-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:inline-flex;
  align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:15px}
.ext-btn:hover{border-color:#FF8C42;color:#FF8C42}
.modal-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;
  border-top:1px solid rgba(255,255,255,.08);padding-top:30px;margin-bottom:36px}
.block-t{font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#FF8C42;margin-bottom:16px}
.track{display:flex;align-items:center;gap:16px;padding:13px 16px;border-radius:10px;transition:background .2s ease}
.track:hover{background:rgba(255,255,255,.05)}
.track:first-child{background:rgba(255,61,90,.10)}
.track b{font-size:12px;font-weight:400;color:rgba(255,255,255,.4);width:20px}
.track span{font-size:13.5px;color:rgba(255,255,255,.85);flex:1}
.notes{font-size:13px;line-height:1.8;color:rgba(255,255,255,.62);margin-bottom:22px}
.impact{border-left:2px solid #FF8C42;padding:2px 0 2px 14px;margin-bottom:30px}
.impact span{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:5px}
.impact p{font-size:12.5px;line-height:1.6;color:#fff}
.credits{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.who{display:flex;align-items:center;gap:12px}
.who em{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FF3D5A,#FF8C42);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;font-style:normal}
.who .n{font-size:13px;color:#fff}
.who .r{font-size:10.5px;color:rgba(255,255,255,.45)}
.art-chip{width:44px;height:44px;border-radius:8px;background-size:cover;background-position:center;
  border:1px solid rgba(255,255,255,.12);flex:0 0 auto}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px;
  border-top:1px solid rgba(255,255,255,.08);padding-top:24px}
.social-sm{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);display:flex;
  align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.7)}
.social-sm:hover{border-color:#FF8C42;color:#FF8C42}
.barcode{display:flex;gap:2px;align-items:flex-end;height:30px}
.barcode i{height:30px;background:rgba(255,255,255,.55);display:block}

function applyStrings(){
  var t = T[state.lang];
  document.documentElement.lang = state.lang;
  var nodes = document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-t');
    if(t[k] !== undefined) nodes[i].textContent = t[k];
  }
  var btns = document.querySelectorAll('.langbtn');
  for(var j=0;j<btns.length;j++){
    btns[j].classList.toggle('on', btns[j].getAttribute('data-lang')===state.lang);
  }
}

function renderChips(container){
  var t = T[state.lang];
  var list = [{k:null,label:t.all}].concat(CATS.map(function(c){ return {k:c.k,label:c[state.lang]}; }));
  container.innerHTML = '';
  list.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip mono' + (state.cat===c.k ? ' on' : '');
    b.textContent = c.label;
    b.onclick = function(){ state.cat = (state.cat===c.k || c.k===null) ? null : c.k; render(); };
    container.appendChild(b);
  });
}

function renderFloating(){
  var layers = {1:$('l1'), 2:$('l2'), 3:$('l3')};
  layers[1].innerHTML = ''; layers[2].innerHTML = ''; layers[3].innerHTML = '';
  PROJECTS.forEach(function(p,i){
    var pos = POS[i];
    var active = state.cat && p.cat===state.cat;
    var dim = state.cat && p.cat!==state.cat;

    var holder = document.createElement('div');
    holder.className = 'fcard' + (pos.keep ? ' keep' : '');
    holder.style.top = pos.top+'%';
    holder.style.left = pos.left+'%';
    holder.style.width = pos.w+'px';
    holder.style.zIndex = String(pos.depth);

    var anim = document.createElement('div');
    anim.className = 'fcard-inner';
    anim.style.animation = 'floatY '+pos.dur+'s ease-in-out '+pos.delay+'s infinite alternate';

    var frame = document.createElement('div');
    frame.className = 'fcard-frame' + (active ? ' is-active' : '') + (dim ? ' is-dim' : '');
    frame.setAttribute('role','button');
    frame.setAttribute('tabindex','0');
    frame.setAttribute('aria-label', p.name);

    var im = document.createElement('div');
    im.className = 'fcard-img';
    im.style.backgroundImage = "url('"+heroImg(p)+"')";

    frame.onclick = function(){ openModal(p.id); };
    frame.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(p.id); } };

    frame.appendChild(im); anim.appendChild(frame); holder.appendChild(anim);
    layers[pos.depth].appendChild(holder);
  });
}

/* ============================================================
   SCROLL: video scrub + parallax + morfismo de experiencia
   ============================================================ */
var targetTime = 0;
var heroP = 0;            /* progreso del hero, 0..1 */
var mx = 0, my = 0;       /* desvio del cursor, -1..1 */
var heroInView = true;
var ticking = false, mouseTick = false;

/* --- nodos cacheados -------------------------------------------------
   antes se resolvia un querySelectorAll('.stage') y ocho querySelector('.lyr')
   en CADA evento de scroll. Ahora se resuelven una vez por render.       */
var N = {stages:[], layers:[], human:[], robot:[]};

function cacheNodes(){
  N.track = $('heroTrack'); N.v = $('heroVideo'); N.content = $('heroContent');
  N.bg = $('heroBg');
  N.layers = [$('l1'), $('l2'), $('l3')];
  N.sec = $('experiencia'); N.fill = $('symbFill'); N.pct = $('symbPct');
  N.timeline = $('timeline');
  N.stages = Array.prototype.slice.call(document.querySelectorAll('.stage'));
  N.human = []; N.robot = [];
  for(var i=0;i<4;i++){
    N.human.push(document.querySelector('.lyr[data-h="'+i+'"]'));
    N.robot.push(document.querySelector('.lyr[data-r="'+i+'"]'));
  }
}

/* --- medidas de layout -----------------------------------------------
   scrollHeight/clientHeight/offsetTop no cambian al hacer scroll, pero
   leerlos dentro del handler forzaba un reflow sincrono por evento.
   Se miden una vez por render y por resize.                             */
var M = {stageTop:[], over:0, trackH:0};

function measure(){
  if(!N.timeline) return;
  var wrap = N.timeline.parentNode;
  M.trackH = wrap.clientHeight;
  M.over = N.timeline.scrollHeight - M.trackH;
  M.stageTop = N.stages.map(function(s){ return s.offsetTop; });
}

/* ultimos valores escritos: si no cambian, no se toca el DOM */
var last = {pct:-1, tlShift:null, stageOn:[]};

function updateScroll(){
  var wh = window.innerHeight;

  /* ---- HERO ---- */
  if(N.track && N.v){
    var r = N.track.getBoundingClientRect();
    var total = r.height - wh;
    heroP = total > 0 ? Math.max(0, Math.min(1, (-r.top)/total)) : 0;
    heroInView = r.bottom > 0 && r.top < wh;

    if(isFinite(N.v.duration) && N.v.duration > 0) targetTime = heroP*(N.v.duration - 0.05);

    if(N.content){
      N.content.style.opacity = Math.max(0, 1 - heroP*1.6).toFixed(2);
      N.content.style.transform = 'translate3d(0,'+(heroP*-40).toFixed(0)+'px,0)';
    }
    paintLayers();
  }

  /* ---- EXPERIENCIA ---- */
  if(!N.sec) return;
  var sr = N.sec.getBoundingClientRect();
  var stotal = sr.height - wh;
  var sp = stotal > 0 ? (-sr.top)/stotal : (sr.top < wh*0.5 ? 1 : 0);
  sp = Math.max(0, Math.min(1, sp));

  if(N.fill) N.fill.style.width = (sp*100).toFixed(0)+'%';
  var pct = Math.round(sp*100);
  if(N.pct && pct !== last.pct){ N.pct.textContent = pct; last.pct = pct; }

  /* morfismo por capas, de la cabeza a las piernas */
  for(var i=0;i<4;i++){
    var local = Math.max(0, Math.min(1, (sp - i*0.17) / 0.30));
    if(N.human[i]) N.human[i].style.opacity = (1 - local).toFixed(3);
    if(N.robot[i]) N.robot[i].style.opacity = local.toFixed(3);
  }

  var active = 0;
  for(var s=0;s<N.stages.length;s++){
    var on = sp >= STAGES[s].morph - 0.09;
    if(on) active = s;
    if(last.stageOn[s] !== on){ N.stages[s].classList.toggle('on', on); last.stageOn[s] = on; }
  }

  /* la timeline se desplaza para mantener visible la etapa activa */
  if(N.timeline){
    var shift = 'none';
    if(N.stages.length && M.over > 0 && !window.matchMedia('(max-width:1024px)').matches){
      var y = Math.max(0, Math.min(M.over, (M.stageTop[active]||0) - M.trackH*0.22));
      shift = 'translate3d(0,-'+y.toFixed(0)+'px,0)';
    }
    if(shift !== last.tlShift){ N.timeline.style.transform = shift; last.tlShift = shift; }
  }
}

/* las capas flotantes reciben scroll Y cursor. Se combinan en UNA sola
   escritura de transform: antes cada handler pisaba el valor del otro y
   las tarjetas saltaban entre dos posiciones distintas. */
var LDEPTH = [10, 20, 34];
function paintLayers(){
  var cf = Math.max(0, 1 - heroP*1.9).toFixed(2);
  for(var i=0;i<3;i++){
    var el = N.layers[i];
    if(!el) continue;
    var x = -mx*LDEPTH[i];
    var y = heroP*-(60+i*30) - my*LDEPTH[i];
    el.style.opacity = cf;
    el.style.transform = 'translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
  }
}

/* --- scrub del video --------------------------------------------------
   currentTime solo se toca si hay diferencia real y con el hero a la vista.
   Devuelve true si aun no llego al objetivo, para pedir otro frame.      */
function stepVideo(){
  var v = N.v;
  if(!v || !heroInView || !isFinite(v.duration) || v.duration <= 0) return false;
  var delta = targetTime - v.currentTime;
  if(Math.abs(delta) < 0.04) return false;
  if(v.seeking) return true;   /* seek en vuelo: esperar sin encolar otro */
  v.currentTime = v.currentTime + Math.max(-0.5, Math.min(0.5, delta));
  return true;
}

/* --- un solo rAF para todo -------------------------------------------
   scroll y mousemove solo marcan "hay trabajo"; el DOM se toca una vez por
   frame. Al quedarse quieto el loop se apaga en vez de girar para siempre. */
function requestTick(){
  if(!ticking){ ticking = true; requestAnimationFrame(frame); }
}
function frame(){
  ticking = false;
  updateScroll();
  if(stepVideo()) requestTick();
}

function refresh(){
  cacheNodes(); measure();
  last.pct = -1; last.tlShift = null; last.stageOn = [];
  requestTick();
}

function onMouseMove(e){
  if(window.matchMedia('(max-width:760px)').matches) return;
  mx = (e.clientX/window.innerWidth - 0.5)*2;
  my = (e.clientY/window.innerHeight - 0.5)*2;
  if(!mouseTick){ mouseTick = true; requestAnimationFrame(paintMouse); }
}
function paintMouse(){
  mouseTick = false;
  paintLayers();
  if(N.bg) N.bg.style.transform = 'scale(1.08) translate3d('+(mx*7)+'px,'+(my*7)+'px,0)';
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  render();

  document.querySelectorAll('.langbtn').forEach(function(b){
    b.onclick = function(){ state.lang = b.getAttribute('data-lang'); render(); };
  });

  $('mClose').onclick = closeModal;
  $('mPrev').onclick = function(){ stepModal(-1); };
  $('mNext').onclick = function(){ stepModal(1); };

  document.addEventListener('keydown', function(e){
    if(!state.openId) return;
    if(e.key === 'Escape') closeModal();
    if(e.key === 'ArrowLeft') stepModal(-1);
    if(e.key === 'ArrowRight') stepModal(1);
  });

  window.addEventListener('scroll', requestTick, {passive:true});
  window.addEventListener('resize', function(){ measure(); requestTick(); });
  window.addEventListener('mousemove', onMouseMove, {passive:true});

  var v = $('heroVideo');
  if(v){
    v.muted = true; v.loop = false; v.playsInline = true;
    var prime = function(){
      v.play().then(function(){ v.pause(); v.currentTime = 0; requestTick(); })
              .catch(function(){ requestTick(); });
    };
    if(v.readyState >= 2) prime(); else v.addEventListener('loadeddata', prime, {once:true});
  }
  refresh();
})();
</script>
