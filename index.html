*,*::before,*::after{box-sizing:border-box}

@keyframes floatY{from{transform:translateY(-9px)}to{transform:translateY(11px)}}

/* ---------- HERO ---------- */
.hero-track{position:relative;height:280vh}
.hero-stick{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;transform:scale(1.08);will-change:transform}
.hero-bg video{width:100%;height:100%;object-fit:cover;display:block}
.hero-scrim{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,8,16,.18),transparent 22%,transparent 78%,rgba(8,8,16,.78)),
             radial-gradient(ellipse 560px 400px at 50% 50%,rgba(8,8,16,.62),rgba(8,8,16,.12) 62%,transparent 82%)}
.hero-vignette{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 540px 380px at 50% 50%,rgba(8,8,16,.45),rgba(8,8,16,.10) 58%,transparent 78%)}
.layer{position:absolute;inset:0;pointer-events:none;will-change:transform}

.fcard{position:absolute;pointer-events:auto}
.fcard-frame{border-radius:24px;padding:0;border:1px solid transparent;box-shadow:0 24px 60px rgba(0,0,0,.5);
  cursor:pointer;overflow:hidden;
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .45s ease,box-shadow .45s ease,border-color .45s ease,filter .45s ease}
.fcard-frame:hover{transform:translateY(-5px) scale(1.02) !important;border-color:rgba(255,255,255,.28)}
.fcard-img{aspect-ratio:1/1;border-radius:23px;background-size:cover;background-position:center;display:block}
.fcard-frame.is-active{border-color:rgba(255,140,66,.65);box-shadow:0 0 60px rgba(255,61,90,.35),0 24px 60px rgba(0,0,0,.5);transform:scale(1.08)}
.fcard-frame.is-dim{opacity:.14;filter:grayscale(1);transform:scale(.95)}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
  align-items:center;padding:24px 36px;gap:16px;flex-wrap:wrap}
.brand{font-size:12px;font-weight:500;letter-spacing:.22em;color:rgba(255,255,255,.72)}
.topnav{display:flex;align-items:center;gap:20px}
.toplink{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;color:rgba(255,255,255,.72);transition:color .25s ease}
.toplink:hover{color:#FF8C42}
.toplink span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;border:1px solid rgba(255,255,255,.16);font-size:10px}
.langbox{display:flex;gap:6px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px;
  background:rgba(13,13,24,.6);backdrop-filter:blur(8px)}
.langbtn{font-size:10.5px;letter-spacing:.14em;padding:5px 12px;border-radius:999px;border:none;cursor:pointer;
  background:transparent;color:rgba(255,255,255,.46);transition:all .25s ease}
.langbtn.on{background:#fff;color:#080810}

/* sin transition: la opacidad la escribe el scroll frame a frame, y una
   transicion encima solo agregaba 150ms de retraso al fundido */
.hero-content{position:relative;z-index:5;height:100%;display:flex;align-items:center;justify-content:center;
  pointer-events:none;will-change:transform,opacity}
.hero-inner{max-width:720px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;
  pointer-events:auto;padding:0 24px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.46)}
.hero-inner h1{font-weight:300;font-size:clamp(42px,8.5vw,84px);letter-spacing:-.028em;line-height:1;text-wrap:balance}
.hero-role{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#FF8C42}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:600px}
.chip{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:8px 15px;
  border-radius:999px;cursor:pointer;background:rgba(13,13,24,.6);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.72);transition:all .3s cubic-bezier(.22,1,.36,1)}
.chip:hover{border-color:rgba(255,255,255,.3)}
.chip.on{background:rgba(255,140,66,.10);border-color:rgba(255,140,66,.55);color:#FF8C42}
.cta-light{display:inline-flex;align-items:center;gap:12px;padding:9px 24px 9px 9px;border-radius:999px;
  font-size:13.5px;font-weight:500;background:#fff;color:#080810;margin-top:8px;
  transition:all .25s cubic-bezier(.22,1,.36,1)}
.cta-light:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.5);color:#080810}
.cta-light i,.cta-flame i{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;font-size:15px;font-style:normal}
.cta-light i{background:linear-gradient(135deg,#FF3D5A,#FF8C42);color:#fff}
.scroll-hint{font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.55)}

/* ---------- CLIENTES ---------- */
.clients-strip{padding:32px 0;background:#0B0B16;border-top:1px solid rgba(255,255,255,.08);
  border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative;z-index:6}
.clients-label{text-align:center;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.46);margin-bottom:20px}
.clients-wrap{position:relative;overflow:hidden}
.clients-wrap::before,.clients-wrap::after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
.clients-wrap::before{left:0;background:linear-gradient(to right,#0B0B16 0%,transparent 100%)}
.clients-wrap::after{right:0;background:linear-gradient(to left,#0B0B16 0%,transparent 100%)}
.clients-track{display:flex;align-items:center;width:max-content;animation:scrollClients 22s linear infinite}
.clients-track:hover{animation-play-state:paused}
@keyframes scrollClients{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.client-item{display:flex;align-items:center;gap:10px;padding:0 40px;height:60px;flex-shrink:0;
  border-right:1px solid rgba(255,255,255,.08)}
.client-item img{height:36px;width:auto;max-width:44px;object-fit:contain;flex-shrink:0;
  filter:grayscale(100%) opacity(.55);transition:filter .3s ease,transform .3s ease}
.client-item:hover img{filter:grayscale(0%) opacity(1);transform:scale(1.08)}
.client-item b{font-size:13px;font-weight:500;color:rgba(255,255,255,.55);white-space:nowrap;
  letter-spacing:.02em;transition:color .3s ease}
.client-item:hover b{color:#fff}

/* ---------- SECTIONS ---------- */
.section{position:relative;padding:110px 38px 70px;overflow:hidden}
.section-head{max-width:1180px;margin:0 auto 20px;display:flex;align-items:baseline;justify-content:space-between;
  gap:20px;flex-wrap:wrap}
.section-head h2{font-weight:300;font-size:clamp(28px,4vw,38px);letter-spacing:-.025em}
.section-head .eyebrow{margin-bottom:14px}
.counter{font-size:11px;color:rgba(255,255,255,.30)}

/* ---------- VINYL SHELF ----------
   La seccion mide una pantalla + lo que haya que recorrer en horizontal (el
   alto lo pone measureShelf). El scroll vertical traduce la estanteria de
   izquierda a derecha; al llegar al final, el scroll sigue a la siguiente
   seccion. En movil y con reduced-motion se cae a scroll horizontal nativo. */
#proyectos{padding:0}
/* El sticky ocupa la pantalla y el sobrante NO se acumula en un extremo: lo
   absorbe la estanteria con flex:1, que centra las portadas en el espacio que
   quede. Asi el titulo queda arriba, los filtros abajo y no hay zona muerta ni
   antes ni despues, con cualquier alto de ventana. Centrar el bloque dejaba el
   hueco abajo; anclarlo abajo lo movia arriba. */
.proj-stick{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:52px 38px 40px;overflow:hidden}
.shelf-scroll{flex:1 1 auto;display:flex;align-items:center;
  perspective:2200px;perspective-origin:50% 46%;width:100%;overflow:hidden}
/* width:max-content + margin auto: centra cuando la lista es corta y arranca a
   la izquierda cuando desborda, que es cuando entra el desplazamiento */
/* La portada se escala con el alto de la ventana en vez de ser fija: asi llena
   el espacio que le deja el flex:1 en pantallas altas, en vez de dejar aire, y
   el arte se lee. El solape se calcula sobre la misma variable para que la
   baraja mantenga su proporcion en cualquier medida. */
.shelf{--vw:clamp(240px,38vh,360px);
  display:flex;align-items:center;transform-style:preserve-3d;
  width:max-content;margin:0 auto;padding:0 90px;will-change:transform}
.vinyl{position:relative;flex:0 0 auto;width:var(--vw);height:var(--vw);
  margin-left:calc(var(--vw) * -0.53);
  transform:rotateY(-42deg);transform-origin:50% 50%;transform-style:preserve-3d;cursor:pointer;
  transition:transform .55s cubic-bezier(.22,1,.36,1),filter .45s ease}
/* el hover mueve solo transform y no los margenes: tocar el margen cambia el
   ancho del riel y eso hacia temblar el desplazamiento */
.vinyl:hover{transform:rotateY(0deg) translateZ(130px) translateY(-14px) scale(1.06);
  filter:none;z-index:99 !important}
.vinyl-sleeve{position:absolute;inset:0;border-radius:12px;background-size:cover;background-position:center;
  box-shadow:-22px 26px 46px rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.10);overflow:hidden}
.vinyl-sleeve::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.vinyl-sleeve::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(0,0,0,.25))}
.vinyl-cap{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font-size:11px;letter-spacing:.06em;
  color:rgba(255,255,255,.72);white-space:nowrap;opacity:0;transition:opacity .4s ease}
.vinyl:hover .vinyl-cap{opacity:1}
.vinyl-cap b{color:#FF8C42;font-weight:500}
/* sustituye a la barra de scroll nativa que se perdio al pasar a overflow:hidden */
.shelf-prog{width:min(560px,60%);height:2px;margin:2px auto 0;border-radius:2px;
  background:rgba(255,255,255,.10);overflow:hidden}
.shelf-prog i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#FF3D5A,#FF8C42)}
.shelf-hint{text-align:center;margin-top:18px;font-size:10.5px;letter-spacing:.14em;color:rgba(255,255,255,.3)}
.shelf-chips{margin:22px auto 0;max-width:660px}

@media(max-width:900px),(prefers-reduced-motion:reduce){
  /* sin secuestro del scroll: la estanteria vuelve a desplazarse a mano */
  #proyectos{height:auto !important;padding:110px 0 70px}
  .proj-stick{position:static;height:auto;display:block;padding:0 38px;overflow:visible}
  /* sin flex:1 aqui: el contenedor ya no tiene un alto que repartir */
  .shelf-scroll{display:block;flex:none;padding:64px 0 24px;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  .shelf-scroll::-webkit-scrollbar{height:6px}
  .shelf-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:999px}
  .shelf{transform:none !important}
  .shelf-prog{display:none}
}
/* ---------- EXPERIENCIA ---------- */
#experiencia{position:relative;height:520vh;padding:0}
.exp-stick{position:sticky;top:0;min-height:100vh;display:flex;align-items:center;padding:40px 32px}

/* El HUD es un panel unico con borde, veta radial y dos esquinas diagonales,
   en vez de la reja suelta de antes. auto-fit parte a una sola columna solo
   cuando ya no caben dos de 460px, asi que el breakpoint sale del contenido. */
.exp-panel{position:relative;width:100%;max-width:1560px;margin:0 auto;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);border-radius:20px;
  background:radial-gradient(1200px 700px at 28% 40%,rgba(255,61,90,.05),transparent 60%),#080810;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
/* las esquinas son triangulos hechos con bordes: cero imagenes */
.exp-panel::before,.exp-panel::after{content:"";position:absolute;width:0;height:0;z-index:4}
.exp-panel::before{top:0;right:0;border-top:26px solid #FF8C42;border-left:26px solid transparent}
.exp-panel::after{bottom:0;left:0;border-bottom:22px solid rgba(255,140,66,.55);border-right:22px solid transparent}

/* ----- columna izquierda: HUD ----- */
.exp-figure{position:relative;display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.08);padding:30px 34px 26px;
  min-height:clamp(440px,66vh,760px)}
.hud-head{display:flex;align-items:center;gap:16px}
.hud-dots{margin-left:auto;display:grid;grid-template-columns:repeat(4,4px);gap:4px}
.hud-dots i{display:block;width:4px;height:4px;background:rgba(255,255,255,.25)}
.hud-dots i:nth-child(3),.hud-dots i:nth-child(5),.hud-dots i:nth-child(8){background:rgba(255,255,255,.12)}

/* el video ocupa lo que sobra entre el header y la barra de simbiosis.
   min-height:0 es obligatorio: sin el, un hijo flex no baja de su tamano
   de contenido y el panel se estira de mas. */
.morph-stage{position:relative;flex:1;min-height:0;margin-top:8px;background:#080810}
/* el background del contenedor es el mismo del body a proposito: .exp-stick es
   position:sticky y eso crea un contexto de apilamiento, asi que el
   mix-blend-mode del video no alcanza el fondo de la pagina. Sin ese color el
   screen compone contra un backdrop transparente y sale un rectangulo NEGRO.
   contrast() aplasta el fondo propio del video (6,6,20) a negro puro, y screen
   sobre negro devuelve exactamente el color de abajo.
   El mask radial es del diseno: difumina el borde del encuadre para que la
   figura no quede recortada en una caja. */
.morph-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  mix-blend-mode:screen;filter:contrast(1.25) brightness(1.06);
  -webkit-mask-image:radial-gradient(ellipse 62% 55% at 50% 48%,#000 62%,transparent 98%);
          mask-image:radial-gradient(ellipse 62% 55% at 50% 48%,#000 62%,transparent 98%)}

/* medidores circulares: reemplazan a los globos flotantes */
.gauge{position:absolute;z-index:3;pointer-events:none}
.gauge svg{position:absolute;inset:0}
.gauge-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-txt b{font-weight:300;letter-spacing:-.03em;line-height:1;color:#fff}
.gauge-txt span{margin-top:6px;letter-spacing:.22em;color:rgba(255,255,255,.46);text-transform:uppercase}
.gauge-years{left:0;top:24px;width:150px;height:150px}
.gauge-years .gauge-txt b{font-size:38px}
.gauge-years .gauge-txt span{font-size:10px}
.gauge-projects{right:0;bottom:16px;width:132px;height:132px}
.gauge-projects .gauge-txt b{font-size:32px}
.gauge-projects .gauge-txt span{font-size:9.5px;letter-spacing:.2em}

.sys-labels{position:absolute;left:0;top:46%;z-index:3;display:flex;flex-direction:column;gap:18px}
.sys-labels span{font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.30)}
.hud-circuit{position:absolute;left:52px;top:44%;z-index:3;opacity:.5}

.symb{margin-top:auto;padding-top:18px}
.symb-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.symb-top span{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.symb-top b{font-size:14px;font-weight:400;color:#fff}
.symb-rail{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
/* idem: el ancho lo escribe el scroll, la transicion solo lo hacia arrastrar */
.symb-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#FF3D5A,#FF8C42);
  box-shadow:0 0 14px rgba(255,61,90,.5);will-change:width}

/* ----- columna derecha: timeline ----- */
.exp-body{position:relative;padding:46px 48px 42px;min-width:0}
.exp-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px 30px}
.exp-head h2{min-width:300px;flex:1 1 auto;margin:0;font-weight:300;letter-spacing:-.028em;
  font-size:clamp(2rem,3.2vw,3rem);line-height:1.06}
/* la ultima palabra del titulo va en degradado; se separa en un <i> desde el JS
   para no tener que duplicar el markup por idioma */
.exp-head h2 i{font-style:normal;background:linear-gradient(135deg,#FF3D5A,#FF8C42);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.exp-head h2::after{content:"";display:inline-block;width:12px;height:12px;margin-left:14px;vertical-align:top;
  border-top:2px solid #FF8C42;border-right:2px solid #FF8C42}
.coords{display:flex;align-items:center;gap:14px;flex:none;padding-top:10px}
.coords span{font-size:10.5px;letter-spacing:.08em;color:#FF8C42}

/* padding-left 66 = 44 del nodo + 6 del translateX de las etapas inactivas +
   14 del halo pulsante, si no el overflow:hidden se los come. El rail va por
   el centro del nodo: 66-44+11.5 = 33.5 */
/* el margin-top lo heredamos de .exp-sub cuando existia: sin el, la primera
   etapa nacia pegada al h2 */
.timeline{position:relative;margin-top:26px;padding-left:66px;max-height:52vh;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 46px,#000 88%,transparent);
          mask-image:linear-gradient(180deg,transparent 0,#000 46px,#000 88%,transparent)}
.timeline::before{content:"";position:absolute;left:33px;top:0;bottom:0;width:1px;z-index:1;
  background:linear-gradient(180deg,rgba(255,140,66,.6),rgba(255,255,255,.1))}
/* empuja la primera etapa por debajo de la banda de fundido de 46px: si no,
   nacia dentro y el mask le comia el 86% de la opacidad */
/* sin transition: el transform ahora lo escribe el scroll frame a frame, y una
   transicion encima solo agregaba medio segundo de retraso. Es el mismo caso
   que .hero-content y .lyr en su momento. */
.timeline-inner{padding-top:52px;will-change:transform}

.stage{position:relative;padding:0 0 30px;opacity:.4;transform:translateX(-6px);
  transition:opacity .35s ease,transform .35s ease}
.stage.on{opacity:1;transform:translateX(0)}
.stage-dot{position:absolute;left:-44px;top:26px;width:23px;height:23px;border-radius:50%;
  border:1px dashed rgba(255,140,66,.5);display:flex;align-items:center;justify-content:center}
.stage-dot i{width:11px;height:11px;border-radius:50%;background:#0D0D18;border:1px solid #FF8C42;
  box-shadow:0 0 14px rgba(255,61,90,.45)}
.stage.on .stage-dot i{animation:heroPulse 2.6s ease-in-out infinite}
.stage.hero-stage .stage-dot{border-color:rgba(196,168,255,.5)}
.stage.hero-stage .stage-dot i{border-color:#C4A8FF;box-shadow:0 0 14px rgba(123,47,255,.5)}

   ============================================================ */
var state = {lang:'es', cat:null, openId:null};
var $ = function(id){ return document.getElementById(id); };
var catOf = function(k){ for(var i=0;i<CATS.length;i++){ if(CATS[i].k===k) return CATS[i]; } return CATS[0]; };
var byId = function(id){ for(var i=0;i<PROJECTS.length;i++){ if(PROJECTS[i].id===id) return PROJECTS[i]; } return null; };
var filtered = function(){ return PROJECTS.filter(function(p){ return !state.cat || p.cat===state.cat; }); };
var cardImg = function(p){ return 'assets/v2/cards/'+p.img+'.jpg'; };
var heroImg = function(p){ return 'assets/v2/hero/'+p.img+'.jpg'; };

function applyStrings(){
  var t = T[state.lang];
  document.documentElement.lang = state.lang;
  var nodes = document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-t');
    if(t[k] !== undefined) nodes[i].textContent = t[k];
  }
  var btns = document.querySelectorAll('.langbtn');
  for(var j=0;j<btns.length;j++){
    btns[j].classList.toggle('on', btns[j].getAttribute('data-lang')===state.lang);
  }

  /* el titulo de experiencia lleva la ultima palabra en degradado. Se parte
     aqui en vez de en el markup para no duplicarlo por idioma: "fundador" en
     es y "founder" en en salen del mismo string de T. */
  var h = document.getElementById('expTitle');
  if(h){
    var pal = (t.expTitle || '').split(' ');
    var fin = pal.pop();
    h.textContent = pal.join(' ') + (pal.length ? ' ' : '');
    var em = document.createElement('i');
    em.textContent = fin;
    h.appendChild(em);
  }
}

function renderChips(container){
  var t = T[state.lang];
  var list = [{k:null,label:t.all}].concat(CATS.map(function(c){ return {k:c.k,label:c[state.lang]}; }));
  container.innerHTML = '';
  list.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip mono' + (state.cat===c.k ? ' on' : '');
    b.textContent = c.label;
    b.onclick = function(){ state.cat = (state.cat===c.k || c.k===null) ? null : c.k; render(); };
    container.appendChild(b);
  });
}

function renderFloating(){
  var layers = {1:$('l1'), 2:$('l2'), 3:$('l3')};
  layers[1].innerHTML = ''; layers[2].innerHTML = ''; layers[3].innerHTML = '';
  PROJECTS.forEach(function(p,i){
    var pos = POS[i];
    var active = state.cat && p.cat===state.cat;
    var dim = state.cat && p.cat!==state.cat;

    var holder = document.createElement('div');
    holder.className = 'fcard' + (pos.keep ? ' keep' : '');
    holder.style.top = pos.top+'%';
    holder.style.left = pos.left+'%';
    holder.style.width = pos.w+'px';
    holder.style.zIndex = String(pos.depth);

    var anim = document.createElement('div');
    anim.className = 'fcard-inner';
    anim.style.animation = 'floatY '+pos.dur+'s ease-in-out '+pos.delay+'s infinite alternate';

    var frame = document.createElement('div');
    frame.className = 'fcard-frame' + (active ? ' is-active' : '') + (dim ? ' is-dim' : '');
    frame.setAttribute('role','button');
    frame.setAttribute('tabindex','0');
    frame.setAttribute('aria-label', p.name);

    var im = document.createElement('div');
    im.className = 'fcard-img';
    im.style.backgroundImage = "url('"+heroImg(p)+"')";

    frame.onclick = function(){ openModal(p.id); };
    frame.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(p.id); } };

    frame.appendChild(im); anim.appendChild(frame); holder.appendChild(anim);
    layers[pos.depth].appendChild(holder);
  });
}

function renderShelf(){
  var list = filtered(), shelf = $('shelf');
  shelf.innerHTML = '';
  list.forEach(function(p,i){
    var c = document.createElement('div');
    c.className = 'vinyl';
    c.style.zIndex = String(list.length - i);
    c.setAttribute('role','button');
    c.setAttribute('tabindex','0');
    c.setAttribute('aria-label', p.name);
    c.innerHTML = '<div class="vinyl-sleeve" style="background-image:url(\''+cardImg(p)+'\')"></div>'
                + '<div class="vinyl-cap mono"><b>'+p.id+'</b> · '+p.name+'</div>';
    c.onclick = function(){ openModal(p.id); };
    c.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(p.id); } };
    shelf.appendChild(c);
  });
  var n = list.length;
  $('gridEyebrow').textContent = '[ '+(state.lang==='es'?'PROYECTOS':'PROJECTS')+' / '+String(n).padStart(2,'0')+' ]';
  $('gridCount').textContent = n+' / '+PROJECTS.length;
}

function renderClients(){
  var track = $('clientsTrack');
  var item = function(c, clone){
    return '<div class="client-item">'
         + '<img src="'+c.logo+'" alt="'+(clone ? '' : c.name)+'" loading="lazy">'
         + '<b>'+c.name+'</b></div>';
  };
  /* se duplica la lista para que el desplazamiento sea continuo */
  track.innerHTML = CLIENTS.map(function(c){ return item(c,false); }).join('')
                  + CLIENTS.map(function(c){ return item(c,true); }).join('');
}

function renderTimeline(){
  var tl = $('timeline');
  tl.innerHTML = '';
  STAGES.forEach(function(s,i){
    var d = document.createElement('div');
    d.className = 'stage' + (s.company==='HERO' ? ' hero-stage' : '');
    d.setAttribute('data-i', String(i));
    var skills = s.skills.map(function(k){ return '<span class="skill mono">'+k+'</span>'; }).join('');
    /* el nodo ya no lleva el numero de etapa: en el diseno es un aro punteado
       con un punto que late. El numero seguia en s.n por si hace falta. */
    d.innerHTML = '<div class="stage-dot"><i></i></div>'
      + '<div class="stage-period mono">'+s.period+'</div>'
      + '<div class="stage-card">'
      +   '<h3>'+s.title[state.lang]+'</h3>'
      +   '<div class="stage-co mono">'+s.company+'</div>'
      +   '<p class="mono">'+s.desc[state.lang]+'</p>'
      +   '<div class="skills">'+skills+'</div>'
      + '</div>';
    tl.appendChild(d);
  });
}

function render(){
  applyStrings();
  renderChips($('heroChips'));
  renderChips($('shelfChips'));
  renderFloating();
  renderClients();
  renderShelf();
  renderTimeline();
  if(state.openId) fillModal();
  refresh();
}

function fillModal(){
  var p = byId(state.openId); if(!p) return;
  var t = T[state.lang], L = state.lang;
  var idx = PROJECTS.indexOf(p);

  $('mCounter').innerHTML = '<span style="color:#FF8C42">'+p.id+'</span> / '+String(PROJECTS.length).padStart(2,'0');
  $('mSleeve').style.backgroundImage = "url('"+cardImg(p)+"')";
  $('mDiscLabel').style.backgroundImage = "url('"+cardImg(p)+"')";
  $('mArtChip').style.backgroundImage = "url('"+cardImg(p)+"')";
  $('mCat').textContent = catOf(p.cat)[L];
  $('mCat2').textContent = catOf(p.cat)[L];
  $('mTitle').textContent = p.name;
  $('mDesc').textContent = p[L];
  $('mStack').textContent = p.stack;
  $('mYear').textContent = p.year;
  $('mStatus').innerHTML = '<span class="dot-live"></span>'+p.status[L];
  $('mUpd').textContent = p.updated[L];
  $('mNotes').textContent = p.notes[L];
  /* Tres casos:
     - caseUrl: no hay demo publica pero si caso de estudio, y los enlaces van ahi
     - url: enlace publico normal
     - ninguno: trabajo de cliente sin nada publico. Se ocultan los botones en
       vez de dejarlos apuntando a nada, y el pie lo dice explicitamente. */
  var link = p.caseUrl ? (p.caseUrl + (L==='en' ? '?lang=en' : '')) : p.url;
  if(link){
    $('mDemo').style.display = '';
    $('mExt').style.display = '';
    $('mDemo').href = link;
    $('mExt').href = link;
    $('mRepo').href = link;
    $('mRepo').textContent = p.caseUrl ? t.caseLink
      : p.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  } else {
    $('mDemo').style.display = 'none';
    $('mExt').style.display = 'none';
    $('mRepo').removeAttribute('href');
    $('mRepo').textContent = t.privateProject;
  }
  $('mSku').textContent = 'AC-'+p.id+'26';

  $('mTags').innerHTML = p.tags.map(function(g){ return '<span class="tag">'+g+'</span>'; }).join('');
  $('mTracks').innerHTML = p.tracks.map(function(tr,i){
    return '<div class="track"><b>'+String(i+1).padStart(2,'0')+'</b><span>'+tr[L]+'</span></div>';
  }).join('');

  var imp = $('mImpact');
  if(p.impact){ imp.style.display='block'; $('mImpactTxt').textContent = p.impact[L]; }
  else { imp.style.display='none'; }

  var bc = '';
  for(var i=0;i<26;i++){ bc += '<i style="width:'+(((idx*7+i*3)%5<2)?2:1)+'px"></i>'; }
  $('mBarcode').innerHTML = bc;

  applyStrings();

  /* despues de applyStrings: el boton lleva data-t="demo" y se sobreescribiria
     solo si lo pusieramos antes */
  var demoLbl = $('mDemo').querySelector('span');
  if(demoLbl) demoLbl.textContent = p.caseUrl ? t.viewCase : t.demo;
}

function openModal(id){
  state.openId = id;
  fillModal();
  $('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('modal').scrollTop = 0;
}
function closeModal(){
  state.openId = null;
  $('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function stepModal(d){
  var i = PROJECTS.indexOf(byId(state.openId));
  var n = (i + d + PROJECTS.length) % PROJECTS.length;
  openModal(PROJECTS[n].id);
}

/* ============================================================
   SCROLL: video scrub + parallax + morfismo de experiencia
   ============================================================ */
var targetTime = 0;       /* posicion buscada en el video del hero */
var morphTime = 0;        /* posicion buscada en el video del morfismo */
var heroP = 0;            /* progreso del hero, 0..1 */
var mx = 0, my = 0;       /* desvio del cursor, -1..1 */
var heroInView = true, expInView = false;
var ticking = false, mouseTick = false;

/* --- nodos cacheados -------------------------------------------------
   antes se resolvia un querySelectorAll('.stage') en CADA evento de scroll.
   Ahora se resuelve una vez por render.                                   */
var N = {stages:[], layers:[], human:[], robot:[]};

function cacheNodes(){
  N.track = $('heroTrack'); N.v = $('heroVideo'); N.content = $('heroContent');
  N.bg = $('heroBg');
  N.layers = [$('l1'), $('l2'), $('l3')];
  N.sec = $('experiencia'); N.fill = $('symbFill'); N.pct = $('symbPct');
  N.morph = $('morphVideo');
  N.timeline = $('timeline');
  N.stages = Array.prototype.slice.call(document.querySelectorAll('.stage'));
  N.proj = $('proyectos'); N.shelf = $('shelf'); N.shelfVp = $('shelfVp');
  N.stick = N.proj && N.proj.querySelector('.proj-stick');
  N.shelfProg = $('shelfProg') && $('shelfProg').firstElementChild;
}

/* la misma condicion que el media query: en movil y con reduced-motion el
   desplazamiento es nativo y el JS no toca nada */
function shelfNative(){
  return window.matchMedia('(max-width:900px)').matches
      || window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}

/* --- medidas de layout -----------------------------------------------
   scrollHeight/clientHeight/offsetTop no cambian al hacer scroll, pero
   leerlos dentro del handler forzaba un reflow sincrono por evento.
   Se miden una vez por render y por resize.                             */
var M = {stageTop:[], over:0, trackH:0, shelfOver:0};

function measure(){
  measureShelf();
  if(!N.timeline) return;
  var wrap = N.timeline.parentNode;
  M.trackH = wrap.clientHeight;
  M.over = N.timeline.scrollHeight - M.trackH;
  M.stageTop = N.stages.map(function(s){ return s.offsetTop; });
}

/* El alto de la seccion se calcula: una pantalla para verla quieta, mas
   exactamente lo que la estanteria tiene que recorrer en horizontal. Asi un
   pixel de scroll vertical equivale a uno horizontal y el paso se siente 1:1.
   Se remide en cada render, porque filtrar por categoria cambia el ancho. */
function measureShelf(){
  if(!N.proj || !N.shelf || !N.shelfVp || !N.stick) return;
  if(shelfNative()){
    M.shelfOver = 0;
    N.proj.style.height = '';
    N.shelf.style.transform = '';
    last.shelfX = null;
    return;
  }
  M.shelfOver = Math.max(0, N.shelf.scrollWidth - N.shelfVp.clientWidth);
  /* Una pantalla mas el recorrido horizontal. Tiene que ser una pantalla
     completa: con menos, el rango de scroll de la seccion queda por debajo de lo
     que la estanteria necesita recorrer y termina cuando la siguiente seccion ya
     entro en pantalla. El aire final lo controla el padding del sticky. */
  N.proj.style.height = M.shelfOver > 0
    ? (window.innerHeight + M.shelfOver) + 'px'
    : '';
  /* si al filtrar la lista deja de desbordar, hay que devolver el riel a cero:
     si no se queda con el desplazamiento del filtro anterior */
  if(M.shelfOver === 0){
    N.shelf.style.transform = '';
    if(N.shelfProg) N.shelfProg.style.width = '0';
    last.shelfX = null; last.shelfW = null;
  }
}

/* ultimos valores escritos: si no cambian, no se toca el DOM */
var last = {pct:-1, tlShift:null, stageOn:[], shelfX:null, shelfW:null};

function updateScroll(){
  var wh = window.innerHeight;

  /* ---- PROYECTOS: el scroll vertical recorre la estanteria ---- */
  if(N.proj && N.shelf && M.shelfOver > 0){
    var pr = N.proj.getBoundingClientRect();
    /* el progreso se mide contra el recorrido horizontal, no contra el alto
       total de la seccion: el tramo final es el que despega el bloque, y ahi la
       estanteria ya tiene que estar al final */
    var pp = Math.max(0, Math.min(1, (-pr.top)/M.shelfOver));
    /* un decimal: redondear a entero cuantiza el movimiento y se nota */
    var tx = 'translate3d(-'+(pp*M.shelfOver).toFixed(1)+'px,0,0)';
    if(tx !== last.shelfX){ N.shelf.style.transform = tx; last.shelfX = tx; }
    if(N.shelfProg){
      var w = (pp*100).toFixed(2)+'%';
      if(w !== last.shelfW){ N.shelfProg.style.width = w; last.shelfW = w; }
    }
  }

  /* ---- HERO ---- */
  if(N.track && N.v){
    var r = N.track.getBoundingClientRect();
    var total = r.height - wh;
    heroP = total > 0 ? Math.max(0, Math.min(1, (-r.top)/total)) : 0;
    heroInView = r.bottom > 0 && r.top < wh;

    if(isFinite(N.v.duration) && N.v.duration > 0) targetTime = heroP*(N.v.duration - 0.05);

    if(N.content){
      N.content.style.opacity = Math.max(0, 1 - heroP*1.6).toFixed(2);
      N.content.style.transform = 'translate3d(0,'+(heroP*-40).toFixed(0)+'px,0)';
    }
    paintLayers();
  }

  /* ---- EXPERIENCIA ---- */
  if(!N.sec) return;
  var sr = N.sec.getBoundingClientRect();
  var stotal = sr.height - wh;
  var sp = stotal > 0 ? (-sr.top)/stotal : (sr.top < wh*0.5 ? 1 : 0);
  sp = Math.max(0, Math.min(1, sp));
  expInView = sr.bottom > 0 && sr.top < wh;

  /* dos decimales: con toFixed(0) la barra avanzaba en escalones de 1%, que
     sobre 520vh de scroll son saltos visibles */
  if(N.fill) N.fill.style.width = (sp*100).toFixed(2)+'%';
  var pct = Math.round(sp*100);
  if(N.pct && pct !== last.pct){ N.pct.textContent = pct; last.pct = pct; }

  /* el morfismo humano->androide es el video: el progreso de la seccion
     mapea directo a su linea de tiempo */
  if(N.morph && isFinite(N.morph.duration) && N.morph.duration > 0){
    morphTime = sp*(N.morph.duration - 0.05);
  }

  var active = 0;
  for(var s=0;s<N.stages.length;s++){
    var on = sp >= STAGES[s].morph - 0.09;
    if(on) active = s;
    if(last.stageOn[s] !== on){ N.stages[s].classList.toggle('on', on); last.stageOn[s] = on; }
  }

  /* la timeline se desplaza para mantener visible la etapa activa */
  if(N.timeline){
    var shift = 'none';
    if(N.stages.length && M.over > 0 && !window.matchMedia('(max-width:1024px)').matches){
      var y = Math.max(0, Math.min(M.over, timelineY(sp) - M.trackH*0.22));
      /* un decimal: redondear a entero cuantiza el movimiento a saltos de 1px
         y eso se nota como micro-tembleque en un desplazamiento lento */
      shift = 'translate3d(0,-'+y.toFixed(1)+'px,0)';
    }
    if(shift !== last.tlShift){ N.timeline.style.transform = shift; last.tlShift = shift; }
  }
}

/* Posicion continua de la timeline.
   Antes se usaba M.stageTop[active], que es un indice DISCRETO: la timeline se
   quedaba quieta mientras scrolleabas y de golpe saltaba a la siguiente etapa;
   la transicion de .5s solo maquillaba el salto, y de paso metia medio segundo
   de retraso respecto al scroll.
   Ahora se interpola entre la posicion de la etapa actual y la de la siguiente
   segun donde caiga sp entre sus dos umbrales, asi que sigue al scroll 1:1 sin
   dejar de centrar cada etapa cuando le toca estar activa. */
function timelineY(sp){
  var n = STAGES.length, i = 0;
  while(i < n-1 && sp >= STAGES[i+1].morph) i++;
  var a = STAGES[i].morph;
  var b = (i < n-1) ? STAGES[i+1].morph : 1;
  var k = (b > a) ? Math.max(0, Math.min(1, (sp-a)/(b-a))) : 0;
  var ya = M.stageTop[i] || 0;
  var yb = (i < n-1) ? (M.stageTop[i+1] || ya) : ya;
  return ya + (yb-ya)*k;
}

/* las capas flotantes reciben scroll Y cursor. Se combinan en UNA sola
   escritura de transform: antes cada handler pisaba el valor del otro y
   las tarjetas saltaban entre dos posiciones distintas. */
var LDEPTH = [10, 20, 34];
function paintLayers(){
  var cf = Math.max(0, 1 - heroP*1.9).toFixed(2);
  for(var i=0;i<3;i++){
    var el = N.layers[i];
    if(!el) continue;
    var x = -mx*LDEPTH[i];
    var y = heroP*-(60+i*30) - my*LDEPTH[i];
    el.style.opacity = cf;
    el.style.transform = 'translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
  }
}

/* --- scrub de video ---------------------------------------------------
   Los dos videos son de 24 fps. El objetivo se cuantiza a la rejilla de
   frames: pedir 3.117s y 3.129s pinta el MISMO frame, pero cada peticion
   obliga a decodificar igual. Redondear elimina esos seeks inutiles.

   Y se salta DIRECTO al objetivo. Antes se avanzaba en pasos de 0.5s como
   maximo, asi que recorrer el video entero encadenaba ~16 seeks; como los
   archivos tienen un solo keyframe, cada paso decodifica desde el frame 0
   y el costo crece con la posicion (~11.7ms por segundo de video, medido).
   Sumado daba ~740ms frente a ~92ms de un unico seek. Ademas el clamp hacia
   que el video fuera por detras del scroll en vez de seguirlo.            */
var FRAME = 1/24;

function seekTo(v, objetivo, visible){
  if(!v || !visible || !isFinite(v.duration) || v.duration <= 0) return false;
  var t = Math.round(objetivo/FRAME)*FRAME;
  var max = v.duration - FRAME;
  if(t < 0) t = 0; else if(t > max) t = max;
  if(Math.abs(t - v.currentTime) < FRAME*0.5) return false;
  if(v.seeking) return true;   /* seek en vuelo: esperar sin encolar otro.
                                  Al terminar se ira al objetivo MAS RECIENTE,
                                  no al que habia cuando se pidio este. */
  v.currentTime = t;
  return true;
}
function stepVideos(){
  /* los dos se evaluan siempre: | en vez de || para no cortocircuitar */
  return seekTo(N.v, targetTime, heroInView) | seekTo(N.morph, morphTime, expInView) ? true : false;
}

/* --- un solo rAF para todo -------------------------------------------
   scroll y mousemove solo marcan "hay trabajo"; el DOM se toca una vez por
   frame. Al quedarse quieto el loop se apaga en vez de girar para siempre. */
function requestTick(){
  if(!ticking){ ticking = true; requestAnimationFrame(frame); }
}
function frame(){
  ticking = false;
  updateScroll();
  if(stepVideos()) requestTick();
}

function refresh(){
  cacheNodes(); measure();
  last.pct = -1; last.tlShift = null; last.stageOn = [];
  last.shelfX = null; last.shelfW = null;
  requestTick();
}

function onMouseMove(e){
  if(window.matchMedia('(max-width:760px)').matches) return;
  mx = (e.clientX/window.innerWidth - 0.5)*2;
  my = (e.clientY/window.innerHeight - 0.5)*2;
  if(!mouseTick){ mouseTick = true; requestAnimationFrame(paintMouse); }
}
function paintMouse(){
  mouseTick = false;
  paintLayers();
  if(N.bg) N.bg.style.transform = 'scale(1.08) translate3d('+(mx*7)+'px,'+(my*7)+'px,0)';
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  render();

  document.querySelectorAll('.langbtn').forEach(function(b){
    b.onclick = function(){ state.lang = b.getAttribute('data-lang'); render(); };
  });

  $('mClose').onclick = closeModal;
  $('mPrev').onclick = function(){ stepModal(-1); };
  $('mNext').onclick = function(){ stepModal(1); };

  document.addEventListener('keydown', function(e){
    if(!state.openId) return;
    if(e.key === 'Escape') closeModal();
    if(e.key === 'ArrowLeft') stepModal(-1);
    if(e.key === 'ArrowRight') stepModal(1);
  });

  window.addEventListener('scroll', requestTick, {passive:true});
  window.addEventListener('resize', function(){ measure(); requestTick(); });
  window.addEventListener('mousemove', onMouseMove, {passive:true});

  /* un play()+pause() inicial deja al decodificador listo para buscar; sin eso
     el primer seek de cada video llega tarde. Aplica a los dos por igual. */
  [$('heroVideo'), $('morphVideo')].forEach(function(v){
    if(!v) return;
    v.muted = true; v.loop = false; v.playsInline = true;
    var prime = function(){
      v.play().then(function(){ v.pause(); v.currentTime = 0; requestTick(); })
              .catch(function(){ requestTick(); });
    };
    if(v.readyState >= 2) prime(); else v.addEventListener('loadeddata', prime, {once:true});
  });
  refresh();
})();
</script>
</body>
